packages:
  - 'packages/*'
  - 'apps/*'
# Flat node_modules: with the default isolated layout the native C++ build of Expo modules on
# Windows exceeds CMake/ninja's 250-character object path limit (verified: ninja "build.ninja
# still dirty after 100 tries"). Expo documents hoisted as the supported fallback.
nodeLinker: hoisted
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
