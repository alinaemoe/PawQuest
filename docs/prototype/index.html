<title>Прототип PawQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: слева список экранов, по центру телефон с живым экраном, справа ТЗ-ссылки и поле правок. На узком экране всё в одну колонку. */
:root{
  --a-light:#2f7d5b; --a-dark:#6fd0a0;
  --accent:var(--a-light);
  --accent-ink:#ffffff;
  --bg:color-mix(in oklab,var(--accent) 5%,#f6f8f5);
  --surface:#ffffff;
  --surface-2:color-mix(in oklab,var(--accent) 7%,#f0f3ef);
  --ink:#16201a;
  --muted:#5b6a61;
  --line:color-mix(in oklab,var(--ink) 13%,transparent);
  --accent-soft:color-mix(in oklab,var(--accent) 15%,var(--surface));
  --ev-dog:#d1701f; --ev-person:#2f74c6; --ev-child:#c0408f; --ev-animal:#2f8a55; --ev-ok:#b8860b; --ev-hard:#c43d3d; --ev-ex:#7452c8;
  --map-bg:color-mix(in oklab,var(--accent) 7%,var(--surface-2));
  --map-green:color-mix(in oklab,var(--accent) 24%,var(--surface));
  --map-water:color-mix(in oklab,#4a90c8 30%,var(--surface));
  --map-road:var(--surface);
  --shadow:0 1px 2px rgba(18,32,24,.08),0 10px 30px rgba(18,32,24,.10);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:var(--a-dark); --accent-ink:#0a1710;
    --bg:color-mix(in oklab,var(--accent) 7%,#0e1210);
    --surface:#171c19;
    --surface-2:color-mix(in oklab,var(--accent) 9%,#1e2420);
    --ink:#e8efea; --muted:#9baba2;
    --ev-dog:#f0974f; --ev-person:#6ba6ec; --ev-child:#ec86c4; --ev-animal:#5cc58a; --ev-ok:#e6b83c; --ev-hard:#ee7a76; --ev-ex:#a68cf0;
    --map-water:color-mix(in oklab,#4a90c8 34%,var(--surface));
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --accent:var(--a-dark); --accent-ink:#0a1710;
  --bg:color-mix(in oklab,var(--accent) 7%,#0e1210);
  --surface:#171c19;
  --surface-2:color-mix(in oklab,var(--accent) 9%,#1e2420);
  --ink:#e8efea; --muted:#9baba2;
  --ev-dog:#f0974f; --ev-person:#6ba6ec; --ev-child:#ec86c4; --ev-animal:#5cc58a; --ev-ok:#e6b83c; --ev-hard:#ee7a76; --ev-ex:#a68cf0;
  --map-water:color-mix(in oklab,#4a90c8 34%,var(--surface));
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-palette="sea"]{--a-light:#1d6f8c;--a-dark:#6cc3dd}
:root[data-palette="berry"]{--a-light:#92399b;--a-dark:#d79be0}
:root[data-palette="sun"]{--a-light:#b0620a;--a-dark:#f0b25a}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:20px 40px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1240px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.pal{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0;display:grid;place-items:center;color:#fff}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.swatch svg{width:20px;height:20px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.sw-wrap{display:flex;gap:14px;flex-wrap:wrap}
.sw-wrap2{display:flex;gap:10px}
.switch{width:46px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
.cat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;min-height:64px;justify-content:center}
.cat button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.cat svg{width:22px;height:22px;color:var(--accent)}
.hint{font-size:12.5px;padding:8px 12px;border-radius:12px;background:var(--accent-soft)}
.evempty{border:1.5px dashed var(--line);background:transparent;border-radius:20px;min-height:68px;color:var(--muted);display:grid;place-items:center}
.app{display:grid;grid-template-columns:210px minmax(0,420px) minmax(260px,1fr);gap:28px;align-items:start;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px}
.nav h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.nav button{display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;color:var(--ink)}
.nav button small{font-family:var(--f-mono);color:var(--muted);font-size:11px;min-width:34px}
.nav button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.nav button:hover{background:var(--surface-2)}

.phone{width:100%;max-width:400px;height:780px;border-radius:38px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.statusbar{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 16px 20px;position:relative;scrollbar-width:thin}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 10px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:6px 0;font-size:11px;color:var(--muted);border-radius:12px}
.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
.tabbar svg{width:22px;height:22px}
.layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.toasts{position:absolute;left:12px;right:12px;bottom:86px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:9}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px;box-shadow:var(--shadow)}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:700;padding:2px 4px;filter:brightness(1.25)}
.sheet-wrap{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;background:rgba(10,16,12,.38)}
.sheet{width:100%;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 16px 20px;max-height:86%;overflow-y:auto;box-shadow:var(--shadow)}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}

h3.t{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface-2);border-radius:18px;padding:14px}
.card.flat{background:var(--surface);border:1px solid var(--line)}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.sm{min-height:30px;padding:5px 10px;font-size:12px}
.btn{border:0;border-radius:16px;padding:14px 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;min-height:48px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.full{width:100%}
.start{width:100%;min-height:84px;border:0;border-radius:24px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--f-display);font-weight:600;font-size:18px}
.start svg{width:30px;height:30px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;min-height:76px;justify-content:center}
.tile svg{width:24px;height:24px;color:var(--accent)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft)}
.tag.warn{background:color-mix(in oklab,#d9a23a 24%,var(--surface))}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.listrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.listrow:last-child{border-bottom:0}
.listrow .grow{flex:1;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;flex:none;color:var(--accent)}
.avatar svg{width:26px;height:26px}
.numbig{font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.02em}

/* Active walk */
.awbar{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.awbar .time{font-family:var(--f-mono);font-size:32px;font-weight:500;letter-spacing:-.02em}
.gps{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2)}
.gps i{width:9px;height:9px;border-radius:50%;background:var(--ev-animal)}
.map{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--map-bg)}
.map svg{display:block;width:100%;height:auto}
.rec{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:16px;background:color-mix(in oklab,var(--ev-hard) 16%,var(--surface));border:1px solid color-mix(in oklab,var(--ev-hard) 40%,transparent)}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ev{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:20px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ev:active{transform:scale(.97);background:var(--surface-2)}
.ev .cnt{position:absolute;top:6px;right:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:14px;text-align:right}
.ev .shape{width:24px;height:24px}
.ctl{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.holdbtn{position:relative;overflow:hidden;border:0;border-radius:18px;min-height:60px;background:color-mix(in oklab,var(--ev-hard) 18%,var(--surface));color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.holdbtn .fill{position:absolute;inset:0;background:color-mix(in oklab,var(--ev-hard) 55%,transparent);transform-origin:left;transform:scaleX(0)}
.holdbtn span{position:relative}
.ctlbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:18px;min-height:60px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.ctlbtn svg{width:20px;height:20px}

/* Clicker */
.click{display:flex;flex-direction:column;gap:10px}
.cbtn{border:0;border-radius:24px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.cbtn svg{width:26px;height:26px}
.cbtn:active{transform:scale(.98)}
.cbtn.ok{min-height:150px;background:color-mix(in oklab,var(--ev-animal) 30%,var(--surface));font-size:20px}
.cbtn.mid{min-height:100px;background:color-mix(in oklab,var(--ev-ok) 26%,var(--surface))}
.cbtn.no{min-height:100px;background:color-mix(in oklab,var(--ev-hard) 22%,var(--surface))}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat3 b{display:block;font-family:var(--f-display);font-size:22px}

/* Replay */
.scrub{position:relative;height:44px}
.scrub input{position:absolute;inset:14px 0 auto 0;width:100%;margin:0;accent-color:var(--accent);height:20px}
.tick{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border:2px solid var(--surface);border-radius:50%}
.speed{display:flex;gap:6px}
.evcard{border-radius:18px;background:var(--surface-2);padding:12px 14px}

/* Charts */
.bars{display:flex;align-items:flex-end;gap:6px;height:80px}
.bars div{flex:1;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.85}
.bars div.cur{opacity:1}
.cmp{display:flex;flex-direction:column;gap:8px}
.cmp .line{display:grid;grid-template-columns:86px 1fr 74px;gap:8px;align-items:center;font-size:12.5px}
.track{position:relative;height:12px;border-radius:6px;background:var(--surface)}
.track .ci{position:absolute;top:0;bottom:0;border-radius:6px;background:color-mix(in oklab,var(--accent) 30%,transparent)}
.track .pt{position:absolute;top:-2px;width:4px;height:16px;border-radius:2px;background:var(--accent);margin-left:-2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.wd{height:34px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.wd.done{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.wd.rest{background:var(--accent-soft)}
.wd.pause{background:var(--surface-2);border-style:dashed}
.wd.today{border-color:var(--accent);border-width:2px}
.wd svg{width:16px;height:16px}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach div{border-radius:16px;padding:12px 6px;text-align:center;font-size:11.5px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px}
.ach div.lock{opacity:.5}
.ach svg{width:30px;height:30px;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted)}
textarea,input[type="text"]{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;resize:vertical}
.interp{font-style:italic;border-style:dashed}
.stripe{border-left:3px solid var(--accent);padding-left:10px}

.ladder{display:flex;flex-direction:column;gap:6px}
.stage{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.stage .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--surface);border:1px solid var(--line)}
.stage.done .n{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.stage.cur{outline:2px solid var(--accent);background:var(--accent-soft)}
.stage.lock{opacity:.55}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos button{border:0;border-radius:12px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink);background:color-mix(in oklab,var(--accent) 18%,var(--surface-2))}
.photos svg{width:20px;height:20px;color:var(--accent)}
.photos button:nth-child(2n){background:color-mix(in oklab,var(--ev-person) 16%,var(--surface-2))}
.photos button:nth-child(3n){background:color-mix(in oklab,var(--ev-dog) 16%,var(--surface-2))}
.zone{display:grid;grid-template-columns:104px 1fr 54px;gap:8px;align-items:center;font-size:12.5px}
.zone .track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.prog{height:8px;border-radius:4px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.alist .it{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.alist .it:last-child{border-bottom:0}
.alist .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.alist .ico svg{width:22px;height:22px}
.alist .it.lock .ico{background:var(--surface-2);color:var(--muted)}
.tiers{font-size:12px;letter-spacing:2px;color:var(--accent)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.stepper button{height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface-2);font-size:24px}
.stepper output{text-align:center;font-family:var(--f-display);font-size:26px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.scroll-h{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.scroll-h .chip{flex:none}
.cbtn.fz{min-height:92px}
.cbtn.neutral{background:var(--surface-2)}
.trainbtn{width:100%;min-height:68px;border:0;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:14px;text-align:left;font-size:16px}
.trainbtn svg{width:30px;height:30px;flex:none}
.trainbtn small{display:block;font-weight:400;opacity:.85;font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trb{border:0;border-radius:18px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;touch-action:manipulation}
.trb:active{transform:scale(.97)}
.trb svg{width:22px;height:22px}
.trb b{font-size:15px}
.trb.ok{background:color-mix(in oklab,var(--ev-animal) 30%,var(--surface))}
.trb.mid{background:color-mix(in oklab,var(--ev-ok) 26%,var(--surface))}
.trb.no{background:color-mix(in oklab,var(--ev-hard) 22%,var(--surface))}
.trbar{border:2px solid var(--accent);background:var(--accent-soft)}

/* Right column */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side .card.flat h3{font-size:14px;margin-bottom:6px}
.side ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.side textarea{min-height:130px}
.ids{display:flex;flex-wrap:wrap;gap:6px}
.ids code{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);padding:2px 7px;border-radius:6px}

@media (max-width:1040px){
  .app{grid-template-columns:minmax(0,1fr);justify-items:center}
  .nav{position:static;flex-direction:row;overflow-x:auto;width:100%;gap:6px;padding-bottom:4px}
  .nav h2{display:none}
  .nav button{white-space:nowrap;border:1px solid var(--line);flex:none}
  .side{width:100%;max-width:560px}
}
@media (max-width:460px){
  .phone{height:720px;border-radius:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>PawQuest</h1><span>Прототип к ТЗ v0.3 · данные вымышленные</span></div>
    <div class="pal">Палитру и язык меняют в настройках: Собака → Настройки</div>

function chipGroup(root,multi){
  root.addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c||c.dataset.noToggle) return;
    var group=c.parentElement;
    if(!multi && !group.dataset.multi){ [].forEach.call(group.querySelectorAll('.chip'),function(x){x.setAttribute('aria-pressed','false');}); c.setAttribute('aria-pressed','true'); }
    else c.setAttribute('aria-pressed', c.getAttribute('aria-pressed')==='true'?'false':'true');
  });

}

/* Новое место: тип плиткой, название необязательно, нормализация и поиск дубликатов */
function openNewPlace(done){
  var cat=null, qual=[];
  var sh=openSheet('<h3 class="t">Новое место</h3><div class="stack" style="margin-top:12px">'+
    '<div><div class="eyebrow">Тип места</div><div class="cat" id="nc" style="margin-top:6px">'+CATS.map(function(c){return '<button data-c="'+c[0]+'" aria-pressed="false">'+ic(c[2])+c[1]+'</button>';}).join('')+'</div></div>'+
    '<div class="field"><label for="nm">Название (необязательно)</label><input id="nm" type="text" autocomplete="off" placeholder="например: луг у дома"></div>'+
    '<div class="row wrap" id="nq">'+['у дома','за школой','у реки','новое'].map(function(q){return '<button class="chip sm" data-q="'+q+'" data-no-toggle="1" aria-pressed="false">'+q+'</button>';}).join('')+'</div>'+
    '<div id="nh" class="stack"></div>'+
    '<button class="btn full" id="ns">Сохранить место</button></div>',function(){ if(done) done(); });
  var nm=$('#nm',sh.el), nh=$('#nh',sh.el), dupChoice=null;
  function name(){
    var base=tidy(nm.value), c=cat||guessCat(nm.value);
    return base;
  }
  function refresh(){
    var raw=nm.value, guessed=guessCat(raw);
    if(guessed && !cat){ cat=guessed==='street'||guessed==='vet'?'other':guessed; }
    [].forEach.call($('#nc',sh.el).children,function(b){b.setAttribute('aria-pressed',b.dataset.c===cat);});
    var t=tidy(raw), out='';
    if(t && t!==raw.trim()) out+='<div class="hint">Будет записано как «'+esc(t)+'»</div>';
    if(guessed) out+='<div class="hint">Распознан тип: '+CATLABEL[guessed]+'</div>';
    var d=t?findDup(t):null;
    if(d && dupChoice!==d.n+'|no') out+='<div class="hint">Похоже на «'+esc(d.n)+'». Это то же место?<div class="row" style="margin-top:6px"><button class="chip sm" id="dy" data-no-toggle="1">Да, то же</button><button class="chip sm" id="dn" data-no-toggle="1">Нет, отдельное</button></div></div>';
    if(!t) out+='<div class="muted" style="font-size:12.5px">Без названия место будет называться по типу, например «'+(cat?CATLABEL[cat]:'Луг')+'».</div>';
    nh.innerHTML=out;
    var dy=$('#dy',nh), dn=$('#dn',nh);
    if(dy) dy.addEventListener('click',function(){ S.place={name:d.n,c:d.c}; sh.close(); toast('Синоним «'+t+'» запомнен: теперь это «'+d.n+'»'); });
    if(dn) dn.addEventListener('click',function(){ dupChoice=d.n+'|no'; refresh(); });
  }
  $('#nc',sh.el).addEventListener('click',function(e){var b=e.target.closest('[data-c]'); if(!b) return; cat=b.dataset.c; refresh();});
  nm.addEventListener('input',function(){ refresh(); });
  $('#nq',sh.el).addEventListener('click',function(e){var b=e.target.closest('[data-q]'); if(!b) return; var q=b.dataset.q; var v=nm.value.trim(); if(!v) v=cat?CATLABEL[cat].toLowerCase():'место'; nm.value=v+' '+q; refresh();});
  $('#ns',sh.el).addEventListener('click',function(){
    var c=cat||'other', t=tidy(nm.value)||CATLABEL[c];
    var exists=S.places.filter(function(p){return p.n===t;}).length;
    if(exists) t=t+' '+(exists+1);
    S.places.push({n:t,c:c,v:0}); S.place={name:t,c:c};
    sh.close(); toast('Место «'+t+'» добавлено');
  });
  refresh();
}

  var markers=EVS.map(function(e,i){return '<circle class="em" data-i="'+i+'" r="6" fill="'+colors[e.k]+'" stroke="var(--surface)" stroke-width="2"/>';}).join('');
  el.innerHTML='<div class="stack"><div><h3 class="t">Воскресная прогулка в парке</h3><div class="muted">38 мин · пример демо-данных</div></div>'+
   '<div class="map">'+mapSvg('<path id="rt" d="'+smooth(ROUTE)+'" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/><path id="rp" d="'+smooth(ROUTE)+'" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>'+markers+'<circle id="dg" r="8" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>')+'</div>'+
   '<div class="scrub" id="sc"><input type="range" id="rg" min="0" max="1000" value="0" aria-label="Время прогулки">'+EVS.map(function(e,i){return '<span class="tick" data-i="'+i+'" style="left:'+(e.f*100)+'%;background:'+colors[e.k]+'"></span>';}).join('')+'</div>'+
   '<div class="row between"><span class="mono" id="cl">09:04</span><span class="mono muted" id="dl">0,00 км</span><span class="mono muted">09:42</span></div>'+
   '<div class="row between"><div class="row"><button class="btn" id="pl" style="width:56px;padding:0;display:grid;place-items:center" aria-label="Воспроизвести">'+ic('play','width="22" height="22"')+'</button></div>'+
   '<div class="speed" id="spd">'+[1,5,20,60].map(function(s){return '<button class="chip sm" data-s="'+s+'" aria-pressed="'+(s===S.speed)+'">'+s+'×</button>';}).join('')+'</div></div>'+
   '<div class="evcard" id="ec"><span class="muted">Нажми ▶ или передвинь ползунок. Тап по цветной метке прыгает к событию.</span></div>'+
   '<div class="row wrap"><button class="chip sm" data-no-toggle="1">Сравнить с другой прогулкой</button><button class="chip sm" data-no-toggle="1">Фильтр событий</button></div></div>';
  var rt=$('#rt',el),rp=$('#rp',el),dg=$('#dg',el),len=rt.getTotalLength();
  rp.setAttribute('stroke-dasharray','0 '+len);
  [].forEach.call(el.querySelectorAll('.em'),function(c){var e=EVS[+c.dataset.i],p=rt.getPointAtLength(e.f*len);c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);});
  var rg=$('#rg',el),playing=false,raf=null,lastTs=0;
  function setT(t){
    S.replayT=Math.max(0,Math.min(1,t));
    var p=rt.getPointAtLength(S.replayT*len); dg.setAttribute('cx',p.x); dg.setAttribute('cy',p.y);
    rp.setAttribute('stroke-dasharray',(S.replayT*len)+' '+len);
    rg.value=Math.round(S.replayT*1000);
    var secs=Math.round(S.replayT*TOTAL), m=Math.floor(secs/60)+4;
    $('#cl',el).textContent='09:'+(m<10?'0':'')+m;
    $('#dl',el).textContent=(2.1*S.replayT).toFixed(2).replace('.',',')+' км';
    var cur=null; EVS.forEach(function(e){ if(S.replayT>=e.f) cur=e; });
    var box=$('#ec',el);
    if(cur) box.innerHTML='<div class="row between"><b>'+cur.h+'</b><span class="mono muted">'+cur.t+'</span></div><div class="muted" style="margin-top:2px">'+cur.d+'</div><button class="chip sm" style="margin-top:8px" data-no-toggle="1">Открыть детали</button>';
  }
  rg.addEventListener('input',function(){setT(rg.value/1000);});
  [].forEach.call(el.querySelectorAll('.tick,.em'),function(x){x.addEventListener('click',function(){setT(EVS[+x.dataset.i].f);});x.style.cursor='pointer';});
  $('#spd',el).addEventListener('click',function(e){
    var b=e.target.closest('[data-s]'); if(!b) return; S.speed=+b.dataset.s;
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',c===b);});
  });
  function loop(ts){
    if(!playing) return;
    var dt=(ts-lastTs)/1000; lastTs=ts;
    setT(S.replayT+dt*S.speed/TOTAL);

    raf=requestAnimationFrame(loop);
  }
  function stop(){playing=false;if(raf)cancelAnimationFrame(raf);$('#pl',el).innerHTML=ic('play','width="22" height="22"');}
  $('#pl',el).addEventListener('click',function(){
    if(playing){stop();return;}
    if(S.replayT>=1) setT(0);
    playing=true; lastTs=performance.now(); this.innerHTML=ic('pause','width="22" height="22"'); raf=requestAnimationFrame(loop);
  });
  cleanups.push(function(){playing=false;if(raf)cancelAnimationFrame(raf);});
  setT(S.replayT||0);
}

/* Clicker */
function rClicker(el){

    el.innerHTML='<div class="click"><div class="row between"><div><div class="eyebrow">Домашняя тренировка · Подзыв · ступень 3 · отвлечение 2</div><div class="mono" style="font-size:30px" id="ck">'+fmt(S.clickT||134)+'</div></div><div style="text-align:right"><div class="numbig">'+n+'</div><span class="muted">попыток</span></div></div>'+
     '<div class="stat3 card"><div><b>'+c.ok+'</b>успех</div><div><b>'+c.mid+'</b>частично</div><div><b>'+c.no+'</b>не вышло</div></div>'+
     (n?'<div class="card flat"><div class="row between"><span>Успех (частично = 0,5)</span><b>'+pct(w.p)+'</b></div><div class="track" style="margin-top:8px"><div class="ci" style="left:'+(w.lo*100)+'%;width:'+((w.hi-w.lo)*100)+'%"></div><div class="pt" style="left:'+(w.p*100)+'%"></div></div><div class="muted" style="font-size:12px;margin-top:6px">Диапазон '+pct(w.lo)+'–'+pct(w.hi)+' · n='+n+(n<5?' · мало данных':n<10?' · предварительно':'')+'</div></div>':'')+
     '<button class="cbtn ok" data-r="ok">'+ic('check')+'Получилось</button>'+
     '<div class="row" style="gap:10px"><button class="cbtn mid" style="flex:1" data-r="mid">'+ic('tilde')+'Частично</button><button class="cbtn no" style="flex:1" data-r="no">'+ic('x')+'Не вышло</button></div>'+
     '<div class="row between"><button class="chip" id="und">'+ic('undo','width="16" height="16"')+' −1 последняя</button><button class="btn" id="stp">Стоп</button></div></div>';
    [].forEach.call(el.querySelectorAll('[data-r]'),function(b){b.addEventListener('click',function(){S.click[b.dataset.r]++;S.click.stack.push(b.dataset.r);view();});});
    $('#und',el).addEventListener('click',function(){var r=S.click.stack.pop(); if(r){S.click[r]--;view();toast('Последняя попытка отменена');}});

  }
  function summary(){
    var c=S.click,n=c.ok+c.mid+c.no;
    var sh=openSheet('<h3 class="t">Сессия завершена</h3><div class="stack" style="margin-top:12px"><div class="card"><b>'+n+' попыток</b> · успех '+pct((c.ok+.5*c.mid)/Math.max(1,n))+'<div class="muted" style="margin-top:4px">В прошлый раз в этом контексте (парк): 3 из 6</div></div>'+
      '<div><div class="eyebrow">Как прошла сессия</div><div class="row wrap" style="margin-top:6px">'+['Не получилось','С трудом','Нормально','Хорошо','Уверенно'].map(function(x,i){return '<button class="chip sm" aria-pressed="'+(i===3)+'">'+x+'</button>';}).join('')+'</div></div>'+
      '<div class="card flat stripe">Последние 10 попыток: 80%+ в двух контекстах. <b>Перейти на ступень 4?</b><div class="row" style="margin-top:8px"><button class="chip sm" data-no-toggle="1" id="lv">Да</button><button class="chip sm" data-no-toggle="1">Пока нет</button></div></div>'+
      '<button class="btn full" id="sv2">Сохранить</button></div>');
    chipGroup(sh.el);
    $('#lv',sh.el).addEventListener('click',function(){toast('Ступень 4 включена');});
    $('#sv2',sh.el).addEventListener('click',function(){sh.close();go('training');toast('Сессия сохранена · +14 Лапок',function(){});});
  }
  view();
  var iv=setInterval(function(){S.clickT=(S.clickT||134)+1;var e=$('#ck',el);if(e)e.textContent=fmt(S.clickT);},1000);
  cleanups.push(function(){clearInterval(iv);});
}

       '<div><div class="eyebrow">Выраженность</div><div class="row wrap" style="margin-top:6px">'+['Слабо','Заметно','Сильно'].map(function(x,i){return '<button class="chip sm" aria-pressed="'+(i===1)+'">'+x+'</button>';}).join('')+'</div></div>'+

    }

/* Питание и вкусняшки */
var LIB=[['dried','Лёгкое сушёное',380,3],['dried','Говяжье ухо сушёное',330,25],['dried','Трахея сушёная',300,15],['dried','Желудок сушёный',340,8],['dried','Рубец сушёный',320,10],['dried','Пищевод сушёный (мясо)',250,10],['raw','Ухо сырое',200,60],['raw','Нос сырой',190,50],['raw','Трахея сырая',140,40]];
var GRP={dried:'Сушёные',raw:'Сырые'};
function foodKcal(n,g){var it=LIB.filter(function(x){return x[1]===n;})[0]; return it?g*it[2]/100:0;}
function openFood(name){
  var it=LIB.filter(function(x){return x[1]===name;})[0], g=it[3]*2, ctx=1;
  var sh=openSheet('<h3 class="t">'+esc(name)+'</h3><div class="muted" style="font-size:12.5px">≈ '+it[2]+' ккал на 100 г · оценка, проверьте упаковку</div><div class="stack" style="margin-top:12px">'+
   '<div class="stepper"><button id="fm" aria-label="Меньше">−</button><output id="fv"></output><button id="fp" aria-label="Больше">+</button></div>'+
   '<div class="row wrap" id="fq">'+[it[3],it[3]*2,it[3]*4].map(function(x){return '<button class="chip sm" data-g="'+x+'" data-no-toggle="1">'+x+' г</button>';}).join('')+'</div>'+
   '<div class="row wrap" id="fc">'+['На прогулке','На тренировке','Дома'].map(function(x,i){return '<button class="chip sm" aria-pressed="'+(i===1)+'">'+x+'</button>';}).join('')+'</div>'+
   '<div class="card" id="fk"></div>'+
   '<button class="btn full" id="fs">Записать</button></div>');
  function draw(){ $('#fv',sh.el).textContent=g+' г'; var k=g*it[2]/100; $('#fk',sh.el).innerHTML='≈ <b>'+Math.round(k)+' ккал</b> <span class="muted">(диапазон '+Math.round(k*.8)+'–'+Math.round(k*1.2)+')</span>'; }
  draw(); chipGroup(sh.el);
  $('#fm',sh.el).addEventListener('click',function(){g=Math.max(1,g-1);draw();});
  $('#fp',sh.el).addEventListener('click',function(){g=g+1;draw();});
  $('#fq',sh.el).addEventListener('click',function(e){var b=e.target.closest('[data-g]'); if(b){g=+b.dataset.g;draw();}});
  $('#fs',sh.el).addEventListener('click',function(){
    var cx=[].filter.call($('#fc',sh.el).children,function(c){return c.getAttribute('aria-pressed')==='true';})[0];
    S.food.push({t:'9:41',n:name,g:g,ctx:cx?cx.textContent.toLowerCase():'дома'}); sh.close(); toast('Записано: '+name+', ≈ '+Math.round(g*it[2]/100)+' ккал'); if(S.screen==='nutrition') render();
  });
}
function rNutrition(el){
  var total=S.food.reduce(function(s,x){return s+foodKcal(x.n,x.g);},0);
  var by={}; S.food.forEach(function(x){by[x.ctx]=(by[x.ctx]||0)+foodKcal(x.n,x.g);});
  var days=[48,62,55,70,66,58,Math.round(total)], mx=Math.max.apply(null,days), dn=['пн','вт','ср','чт','пт','сб','сегодня'];
  el.innerHTML='<div class="stack"><div class="row between"><h3 class="t">Питание и вкусняшки</h3><button class="chip sm" data-act="lib">Библиотека</button></div>'+
   '<div class="card flat" style="font-size:12.5px">Значения ккал приблизительные (в прототипе условные). Рацион и вес обсуждайте с ветеринаром.</div>'+
   '<div class="card"><div class="eyebrow">Сегодня</div><div class="numbig" style="margin-top:4px">≈ '+Math.round(total)+' ккал</div><div class="muted" style="font-size:12.5px">диапазон '+Math.round(total*.8)+'–'+Math.round(total*1.2)+' · '+Object.keys(by).map(function(k){return k+' '+Math.round(by[k]);}).join(' · ')+'</div></div>'+
   '<div><div class="eyebrow" style="margin-bottom:6px">Быстро (избранное)</div><div class="tiles">'+['Лёгкое сушёное','Говяжье ухо сушёное','Трахея сушёная'].map(function(n){return '<button class="tile" data-f="'+n+'">'+ic('cookie')+n.replace(' сушёное','').replace(' сушёная','')+'</button>';}).join('')+'</div></div>'+
   '<div class="card flat"><div class="eyebrow">Что давали сегодня</div>'+S.food.map(function(x){return '<div class="listrow"><div class="avatar" style="width:36px;height:36px">'+ic('cookie','width="18" height="18"')+'</div><div class="grow"><div>'+esc(x.n)+'</div><div class="muted" style="font-size:12.5px">'+x.t+' · '+x.g+' г · '+x.ctx+'</div></div><span class="mono">≈ '+Math.round(foodKcal(x.n,x.g))+'</span></div>';}).join('')+'</div>'+
   '<div class="card flat"><div class="eyebrow">Неделя · ≈ ккал лакомств в день</div><div class="bars" style="margin-top:10px">'+days.map(function(v,i){return '<div class="'+(i===6?'cur':'')+'" style="height:'+(v/mx*100)+'%" title="'+dn[i]+': '+v+'"></div>';}).join('')+'</div><div class="week" style="margin-top:4px">'+dn.map(function(d){return '<span>'+d.slice(0,3)+'</span>';}).join('')+'</div></div>'+
   '<div class="card flat"><div class="eyebrow">Лакомства и вес</div><div style="margin-top:6px">'+dualChart(S.w,S.wTreat,'Вес','Лакомства, ≈ ккал/день')+'</div><p class="muted" style="font-size:12px;margin-top:6px">Ряды совпадают по времени, это не причинная связь. n=12 недель.</p></div>'+
   '<div id="libv"></div></div>';
  el.addEventListener('click',function(e){
    var f=e.target.closest('[data-f]'); if(f){ openFood(f.dataset.f); return; }
    var l=e.target.closest('[data-act="lib"]'); if(l){
      var box=$('#libv',el);
      box.innerHTML=box.innerHTML?'':'<div class="card flat"><div class="eyebrow">Библиотека лакомств</div>'+['dried','raw'].map(function(g){return '<div style="margin-top:8px"><div class="muted" style="font-size:12px">'+GRP[g]+'</div>'+LIB.filter(function(x){return x[0]===g;}).map(function(x){return '<button class="listrow" data-f="'+x[1]+'" style="width:100%;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)"><div class="grow"><div>'+x[1]+'</div><div class="muted" style="font-size:12px">≈ '+x[2]+' ккал / 100 г · оценка</div></div><span class="tag">записать</span></button>';}).join('')+'</div>';}).join('')+'<p class="muted" style="font-size:12px;margin-top:8px">Свои позиции и правка ккал: в приложении.</p></div>';
    }
  });
}

/* Проект «Фризби» */
var STAGES=[['Знакомство с диском','интерес ≥ 3 раз за сессию'],['Диск — это игрушка','держит диск 3 с, 5 раз'],['Принос и «дай»','5 из 7'],['Катящийся диск','6 из 10 на 2–3 м'],['Скольжение по земле','7 из 10 на 3–5 м'],['Ловля из рук (близко)','8 из 10'],['Низкий полёт 20–40 см','7 из 10 на 2–3 м'],['Низкий полёт на 5 м','7 из 10'],['Серия','3 ловли подряд'],['Разные условия','поверхности, ветер'],['На прогулке','при отвлечении D3+'],['Выше','по согласованию со специалистом']];
function rFrisbee(el){
  var CUR=4, stack=[];
  function view(){
    var c=S.fz, n=c.ok+c.touch+c.miss+c.no, k=c.ok+0.5*c.touch, w=n?wilson(k,n):null;
    function dist(l,k2,n2){var w2=wilson(k2,n2);return '<div class="line"><span>'+l+'</span><div class="track"><div class="ci" style="left:'+(w2.lo*100)+'%;width:'+((w2.hi-w2.lo)*100)+'%"></div><div class="pt" style="left:'+(w2.p*100)+'%"></div></div><span class="mono">'+k2+' из '+n2+(n2<5?' *':'')+'</span></div>';}
    el.innerHTML='<div class="stack"><div class="row between"><h3 class="t">Проект · Фризби</h3><button class="chip sm" data-no-toggle="1" data-act="pause">Пауза проекта</button></div>'+
     '<div class="card"><div class="eyebrow">Ступень '+CUR+' из 11</div><div style="font-weight:600;font-size:16px;margin-top:2px">'+STAGES[CUR][0]+'</div><div class="muted" style="font-size:12.5px">Критерий: '+STAGES[CUR][1]+'</div><div class="prog" style="margin-top:10px"><i style="width:72%"></i></div><div class="muted mono" style="font-size:11.5px;margin-top:4px">последние 10 бросков: 5 из 7 нужных · 2 сессии из 2</div></div>'+
     '<div class="card flat"><div class="row between"><div><div class="eyebrow">Сессия</div><div class="numbig">'+n+' <span class="muted" style="font-size:14px;font-family:var(--f-body)">бросков</span></div></div><div style="text-align:right"><div class="numbig">'+(n?pct(w.p):'—')+'</div><span class="muted" style="font-size:12px">поймала (частично = 0,5)</span></div></div>'+
      (n?'<div class="track" style="margin-top:10px"><div class="ci" style="left:'+(w.lo*100)+'%;width:'+((w.hi-w.lo)*100)+'%"></div><div class="pt" style="left:'+(w.p*100)+'%"></div></div><div class="muted" style="font-size:12px;margin-top:6px">Диапазон '+pct(w.lo)+'–'+pct(w.hi)+' · n='+n+(n<5?' · мало данных':n<10?' · предварительно':'')+' · серия '+c.streak+', лучшая 3</div>':'')+'</div>'+
     '<div class="click"><button class="cbtn ok fz" data-r="ok">'+ic('check')+'Поймала</button>'+
     '<div class="row" style="gap:10px"><button class="cbtn mid fz" style="flex:1" data-r="touch">'+ic('tilde')+'Коснулась</button><button class="cbtn no fz" style="flex:1" data-r="miss">'+ic('x')+'Упустила</button></div>'+
     '<button class="cbtn neutral" style="min-height:56px;font-size:15px" data-r="no">Не заинтересовалась</button>'+
     '<div class="row between"><button class="chip" id="und">'+ic('undo','width="16" height="16"')+' −1 последний</button><button class="btn" id="sv">Сохранить сессию</button></div></div>'+
     '<div class="card flat"><div class="eyebrow">Доля ловли по дистанции</div><div class="cmp" style="margin-top:8px">'+dist('2–3 м',9,10)+dist('3–5 м',5,10)+dist('5 м',1,3)+'</div><div class="muted" style="font-size:12px;margin-top:6px">* мало данных. Диапазоны Уилсона 95%.</div></div>'+
     '<div class="card flat"><div class="eyebrow">Лестница</div><div class="ladder" style="margin-top:8px">'+STAGES.map(function(s,i){var cl=i<CUR?'done':i===CUR?'cur':'lock'; return '<div class="stage '+cl+'"><div class="n">'+(i<CUR?'✓':i)+'</div><div><div style="font-weight:600;font-size:13px">'+s[0]+'</div><div class="muted" style="font-size:12px">'+s[1]+'</div></div>'+(i===11?ic('shield','width="18" height="18"'):'')+'</div>';}).join('')+'</div></div>'+
     '<div class="card flat"><div class="eyebrow">Вовлечённость по сессиям</div><div class="bars" style="margin-top:10px;height:56px">'+[3,3,4,4,3,4,5].map(function(v){return '<div style="height:'+(v/5*100)+'%"></div>';}).join('')+'</div><div class="muted" style="font-size:12px;margin-top:6px">Оценка 1–5 по ощущениям владельца · 7 сессий</div></div>'+
     '<div class="card flat"><div class="eyebrow">Достижения проекта · 4 из 9</div><div class="row wrap" style="margin-top:8px"><span class="tag">Интересно!</span><span class="tag">Диск — игрушка</span><span class="tag">Принесла</span><span class="tag">Догнала</span></div><button class="chip sm" data-go="quests" style="margin-top:8px" data-no-toggle="1">Все достижения</button></div>'+
     '<div class="card flat stripe"><div class="eyebrow">Безопасность</div><p style="margin-top:4px;font-size:13px">Для мелких собак выбирайте мягкий лёгкий диск и броски у земли. Прыжки — только после консультации со специалистом.</p></div></div>';
    [].forEach.call(el.querySelectorAll('[data-r]'),function(b){b.addEventListener('click',function(){var r=b.dataset.r; S.fz[r]++; stack.push(r); S.fz.streak=(r==='ok')?S.fz.streak+1:0; view();});});
    $('#und',el).addEventListener('click',function(){var r=stack.pop(); if(r){S.fz[r]--; view(); toast('Последний бросок отменён');}});
    $('#sv',el).addEventListener('click',function(){toast('Сессия сохранена · +12 Лапок',function(){});});
    var ps=$('[data-act="pause"]',el); if(ps) ps.addEventListener('click',function(){toast('Проект на паузе: карточки скрыты с экранов');});
  }
  view();
}

/* Dog hub */
function rDog(el){
  el.innerHTML='<div class="stack"><div class="card" style="text-align:center"><div class="avatar" style="width:84px;height:84px;margin:0 auto 8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:50px;height:50px">'+IC.paw+'</svg></div><h3 class="t" style="font-size:18px">Луна</h3><div class="muted">Цвергшнауцер · девочка · 1 год 2 мес</div></div>'+
   '<div class="card flat"><div class="eyebrow">Цели</div><div class="row wrap" style="margin-top:6px"><span class="tag">Подзыв</span><span class="tag">Спокойствие</span><span class="tag">Социализация</span></div></div>'+
   '<div class="card flat"><div class="eyebrow">Особенности (со слов владельца)</div><div class="row wrap" style="margin-top:6px"><span class="tag">любит мячик</span><span class="tag">самокаты</span><span class="tag">лакомство: курица</span></div></div>'+
   ['journal|note|Дневник поведения','frisbee|disc|Проект: Фризби','quests|star|Цели и награды','care|heart|Здоровье и вес','nutrition|cookie|Питание и вкусняшки','places|map|Библиотека мест','dog|cal|Календарь (S18)','settings|cog|Настройки и данные'].map(function(r){var p=r.split('|');return row(p[1],p[2],'',p[0]);}).join('')+
   '<p class="muted" style="font-size:12px">Пока в приложении одна собака, здесь нет переключателя собак. Он появится после «Добавить вторую собаку».</p></div>';

/* ---------- каркас ---------- */
var TABS=[['today','Сегодня','home'],['walks','Прогулки','pin'],['training','Тренировки','target'],['insights','Инсайты','chart'],['dog','Собака','paw']];
var TABGO={today:'today',walks:'walks',training:'training',insights:'insights',dog:'dog'};

function buildNav(){
  $('#nav').innerHTML='<h2>Экраны</h2>'+SCREENS.map(function(s){return '<button data-id="'+s.id+'"><small>'+s.code+'</small>'+s.label+'</button>';}).join('');
  $('#nav').addEventListener('click',function(e){var b=e.target.closest('[data-id]'); if(b) go(b.dataset.id);});
  $('#tabbar').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'">'+ic(t[2])+t[1]+'</button>';}).join('');
  $('#tabbar').addEventListener('click',function(e){var b=e.target.closest('[data-t]'); if(b) go(TABGO[b.dataset.t]);});
  $('#screen').addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g){ var id=g.dataset.go; if(id==='journal') S.journalView='feed'; go(id); }
    var a=e.target.closest('[data-act="m"]'); if(a) toast('Форма ручной записи откроется в приложении');
  });
}
function go(id){
  cleanups.forEach(function(f){f();}); cleanups=[];
  closeSheet(); S.screen=id; save(); render(); $('#screen').scrollTop=0;
}
function render(){
  var s=BYID[S.screen], el=$('#screen');
  el.replaceWith(el.cloneNode(false)); el=$('#screen'); /* сброс обработчиков */
  el.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g){ var id=g.dataset.go; if(id==='journal') S.journalView='feed'; go(id); }
    var a=e.target.closest('[data-act="m"]'); if(a) toast('Форма ручной записи откроется в приложении');
  });
  s.render(el);
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.setAttribute('aria-current',b.dataset.id===s.id);});
  [].forEach.call(document.querySelectorAll('#tabbar button'),function(b){b.setAttribute('aria-current',b.dataset.t===s.tab);});
  $('#sTitle').textContent=s.code+' · '+s.label;
  $('#sIds').innerHTML=s.specs.map(function(x){return '<code>'+x+'</code>';}).join('');
  $('#sAsk').innerHTML=s.ask.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
  var fb=$('#fb'); fb.value=notes[s.id]||''; updCount();
}

/* ---------- правки ---------- */
var notes={};
try{ notes=JSON.parse(store.get('pq_notes')||'{}')||{}; }catch(e){ notes={}; }
function saveNotes(){ store.set('pq_notes',JSON.stringify(notes)); }
function updCount(){
  var n=Object.keys(notes).filter(function(k){return (notes[k]||'').trim();}).length;
  $('#fbCount').textContent=n?('Правки в '+n+' '+(n===1?'экране':'экранах')):'Пока без правок';
}
function save(){ store.set('pq_screen',S.screen); }

function init(){
  buildNav();
  var sv=store.get('pq_screen'); if(sv && BYID[sv]) S.screen=sv;
  var pal=store.get('pq_pal')||'forest'; setPal(pal);
  $('#fb').addEventListener('input',function(){ notes[S.screen]=this.value; saveNotes(); updCount(); });
  $('#copyAll').addEventListener('click',function(){
    var out=SCREENS.filter(function(s){return (notes[s.id]||'').trim();}).map(function(s){return s.code+' '+s.label+':\n'+notes[s.id].trim();}).join('\n\n');
    var msg=$('#copyMsg'), ta=$('#fbAll');
    if(!out){ msg.textContent='Пока нечего копировать.'; return; }
    ta.hidden=false; ta.value=out; ta.style.minHeight='140px';
    function fallback(){ ta.focus(); ta.select(); msg.textContent='Выдели текст выше и скопируй, затем вставь в чат.'; }
    try{ navigator.clipboard.writeText(out).then(function(){msg.textContent='Скопировано. Вставь в чат.';},fallback); }catch(e){ fallback(); }
  });
  render();
}
function setPal(p){
  var map={forest:null,sea:'sea',berry:'berry',sun:'sun'};
  if(map[p]) document.documentElement.setAttribute('data-palette',map[p]); else document.documentElement.removeAttribute('data-palette');
  store.set('pq_pal',p);
}
init();
})();
